<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Resource Engine: one trusted source of community resource listings." />
    <title>Resource Engine</title>
    <script>
      // Apply the saved or OS theme before first paint so the page doesn't flash.
      (function () {
        var choice = "system";
        try { choice = localStorage.getItem("re-theme") || "system"; } catch (e) {}
        var dark = choice === "dark" || (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
