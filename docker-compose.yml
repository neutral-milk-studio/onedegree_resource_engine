services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: resource_engine
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_DB: resource_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource_engine"]
      interval: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

volumes:
  postgres-data:
