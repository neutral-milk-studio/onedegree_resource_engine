# Local baseline for The Resource Engine. No AWS account needed. Model calls use the offline
# stand-in unless LLM_BACKEND=bedrock. API and UI: http://localhost:8000
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: resource_engine
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: resource_engine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource_engine"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      RE_DATABASE_URL: postgresql://resource_engine:local_dev_only@postgres:5432/resource_engine
    command: sh -c "python -m api.app.jobs.run import && uvicorn api.app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    # One maintenance pass: docker compose --profile jobs run --rm worker
    profiles: ["jobs"]
    build: { context: ., dockerfile: maintenance/Dockerfile }
    environment:
      RE_DATABASE_URL: postgresql://resource_engine:local_dev_only@postgres:5432/resource_engine
      RE_WEBSITE_SOURCE: sample
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      AWS_REGION: ${AWS_REGION:-us-west-2}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
