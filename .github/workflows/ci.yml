name: CI

# Guardrail gates. All four must pass before a PR can merge into protected main.
# Uses the uv + pyproject.toml toolchain established in the repo (see Makefile:
# `make setup/test/lint`). Spec: Requirements 3.1, 3.2, 3.3, 44.1.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hsds-schema-validation:
    name: Gate 1 — HSDS schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Validate seed records against pinned HSDS v3.2.3 schema
        run: |
          uv run python - <<'PY'
          # Validates the seeded HSDS dataset against the vendored schema.
          # Skips gracefully (non-blocking) only if the schema has not been
          # vendored yet; once vendored, a validation error fails the gate.
          import sys, pathlib, json
          sys.path.insert(0, ".")
          schema_dir = pathlib.Path("contracts/hsds/schema")
          if not any(schema_dir.glob("*.json")):
              print("::warning::HSDS schema files not vendored yet; skipping validation gate.")
              sys.exit(0)
          from shared.hsds_validation import validate
          data = json.loads(pathlib.Path("seed/hsds_dataset.json").read_text())
          errors = []
          for org in data.get("organizations", []):
              errors += [f"organization {org['id']}: {e}" for e in validate(org, "organization")]
          for svc in data.get("services", []):
              errors += [f"service {svc['id']}: {e}" for e in validate(svc, "service")]
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("HSDS schema validation passed.")
          PY

  secret-scan:
    name: Gate 2 — Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Gate 3 — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies (from pyproject.toml / uv.lock)
        run: uv sync
      - name: Run tests
        run: uv run pytest

  lint:
    name: Gate 4 — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
