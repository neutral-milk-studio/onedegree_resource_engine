name: CI

# Guardrail gates. All must pass before a PR can merge into protected main.
# Uses the uv + pyproject.toml toolchain established in the repo (see Makefile:
# `make setup/test/lint`). Spec: Requirements 3.1, 3.2, 3.3, 44.1.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hsds-schema-validation:
    name: Gate 1 — HSDS schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Validate seed records against pinned HSDS v3.2.3 schema
        run: |
          uv run python - <<'PY'
          # Validates the seeded HSDS dataset against the vendored schema.
          # Skips gracefully (non-blocking) only if the schema has not been
          # vendored yet; once vendored, a validation error fails the gate.
          import sys, pathlib, json
          sys.path.insert(0, ".")
          schema_dir = pathlib.Path("contracts/hsds/schema")
          if not any(schema_dir.glob("*.json")):
              print("::warning::HSDS schema files not vendored yet; skipping validation gate.")
              sys.exit(0)
          from shared.hsds_validation import validate
          data = json.loads(pathlib.Path("seed/hsds_dataset.json").read_text())
          errors = []
          for org in data.get("organizations", []):
              errors += [f"organization {org['id']}: {e}" for e in validate(org, "organization")]
          for svc in data.get("services", []):
              errors += [f"service {svc['id']}: {e}" for e in validate(svc, "service")]
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("HSDS schema validation passed.")
          PY

  secret-scan:
    name: Gate 2 — Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly rather than gitleaks/gitleaks-action@v2,
      # which requires a paid GITLEAKS_LICENSE for organization-owned repos. The
      # binary is Apache-2.0 and needs no license. Config: .gitleaks.toml.
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for committed secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

  tests:
    name: Gate 3 — Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies (from pyproject.toml / uv.lock)
        run: uv sync
      - name: Run tests
        run: uv run pytest

  eval-suspicious:
    name: Gate 4 — Suspicious-listing rules eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Precision/recall against data/eval/suspicious_cases.json
        run: uv run python -m maintenance.eval_suspicious

  lint:
    name: Gate 5 — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  ui:
    name: Gate 6 — UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done
      - run: npm test

  images:
    name: Gate 7 — Images and infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t resource-engine:ci .
      - run: docker build -f maintenance/Dockerfile -t resource-engine-worker:ci .
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
